---
name: Check Collection

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:

  build-ubuntu:
    name: Check package collection (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      PACK_USER_DIR: /root/.config/pack
      PACK_STATE_DIR: /root/.local/state/pack
      PACK_CACHE_DIR: /root/.cache/pack
      PACK_BIN_DIR: /root/.local/bin
      GOFLAGS: "-buildvcs=false"
    strategy:
      fail-fast: false
    container: ghcr.io/stefan-hoeck/idris2-pack:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make output
        run: mkdir -p "$HOME/output"
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install --yes libgsl-dev
          apt-get install --yes libpq-dev
          # ncurses-idris:
          apt-get install --yes libncurses-dev libc6-dev
          # sqlite3:
          apt-get install --yes libsqlite3-dev
          # idrisGL:
          apt-get install --yes libsdl1.2-dev libsdl-image1.2-dev libsdl-mixer1.2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-gfx-dev libsdl2-mixer-dev
          # idris2-go:
          apt-get install --yes golang-go
          # lld (needed by systemd)
          apt-get install --yes lld
          # libuv
          apt-get install --yes libuv1-dev
          # rtlsdr
          apt-get install --yes librtlsdr-dev
          # node codegen:
          apt-get install --yes nodejs
          # spidr ecosystem
          apt-get install --yes curl
          # uuid
          apt-get install --yes uuid-dev
      - name: Use latest pack commit
        run: |
          /root/.local/bin/pack info
          /root/.local/bin/pack update
          /root/.local/bin/pack info
      - name: Install pack-admin
        run: /root/.local/bin/pack --no-prompt install-app pack-admin
      - name: Create Ubuntu collection
        env:
          TARGET_OS: ubuntu
        run: |
          python3 <<'PY'
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          source = Path("collections/HEAD.toml")
          target = Path("/tmp/HEAD.toml")
          target_os = os.environ["TARGET_OS"]

          raw = source.read_text()

          with source.open("rb") as f:
              collection = tomllib.load(f)

          db = collection.get("db", {})

          selected = set()

          for name, entry in db.items():
              runs_on = entry.get("runs-on")

              if runs_on is None:
                  print(
                      f"error: [db.{name}] does not define 'runs-on'",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              if not isinstance(runs_on, list):
                  print(
                      f"error: [db.{name}].runs-on must be an array",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              invalid = set(runs_on) - {"ubuntu", "macos"}

              if invalid:
                  print(
                      f"error: [db.{name}] has invalid runs-on value(s): "
                      f"{sorted(invalid)}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              if target_os in runs_on:
                  selected.add(name)

          # Split at top-level TOML table declarations while retaining
          # the declaration at the beginning of each section.
          sections = re.split(r"(?=^\[)", raw, flags=re.MULTILINE)

          output = []

          for section in sections:
              match = re.match(
                  r"^\[db\.([^\]]+)\]",
                  section,
              )

              # Preserve non-db sections such as [idris2].
              if match is None:
                  output.append(section)
                  continue

              package = match.group(1)

              if package in selected:
                  output.append(section)

          target.write_text("".join(output))

          print(
              f"Selected {len(selected)} packages "
              f"for {target_os}:"
          )

          for name in sorted(selected):
              print(f"  {name}")
          PY
      - name: Copy HEAD
        run: cp /tmp/HEAD.toml "$PACK_STATE_DIR/db/HEAD.toml"
      - name: Extract Collection from HEAD
        run: /root/.local/bin/pack-admin --no-prompt extract-from-head "$PACK_STATE_DIR/db/testdb.toml"
      - name: Switch to testdb
        run: /root/.local/bin/pack --no-prompt switch "testdb"
      - name: Re-Install pack-admin
        run: /root/.local/bin/pack --no-prompt install-app pack-admin
      - name: Check Collection
        run: /root/.local/bin/pack-admin --no-prompt --skip-tests check-collection "$HOME/output/"
      - name: Fail if missing
        run: test -f "$HOME/output/testdb.toml"

  build-macos:
    name: Check package collection (macos-latest)
    runs-on: macos-latest
    env:
      PACK_USER_DIR: /Users/runner/macos-user/.config/pack
      PACK_STATE_DIR: /Users/runner/macos-user/.local/state/pack
      PACK_CACHE_DIR: /Users/runner/macos-user/.cache/pack
      PACK_BIN_DIR: /Users/runner/macos-user/.local/bin
      GOFLAGS: "-buildvcs=false"
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create macos-user directory
        run: mkdir -p "$HOME/macos-user"
      - name: Make output
        run: mkdir -p "$HOME/macos-user/output"
      - name: Install dependencies
        run: |
          set -euxo pipefail
          brew install gmp llvm lld
          LLVM_PREFIX="$(brew --prefix llvm)"
          LLD_PREFIX="$(brew --prefix lld)"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$LLD_PREFIX/bin" >> "$GITHUB_PATH"
          PATH="$LLD_PREFIX/bin:$LLVM_PREFIX/bin:$PATH"
          export PATH
          uname -a
          uname -m
      - name: Build and install Chez Scheme
        run: |
          set -euxo pipefail
          git clone --depth=1 \
            https://github.com/cisco/ChezScheme.git \
            /tmp/ChezScheme
          cd /tmp/ChezScheme
          ./configure \
            --threads \
            --installprefix="$HOME/macos-user/.local"
          make -j"$(sysctl -n hw.ncpu)"
          make install
          echo "$HOME/macos-user/.local/bin" >> "$GITHUB_PATH"
          PATH="$HOME/macos-user/.local/bin:$PATH"
          export PATH
      - name: Install Idris2 and Pack
        run: |
          set -euxo pipefail
          PATH="$HOME/macos-user/.local/bin:$PATH"
          export PATH
          git clone --depth=1 \
            https://github.com/stefan-hoeck/idris2-pack.git \
            /tmp/idris2-pack
          cd /tmp/idris2-pack
          make micropack SCHEME=scheme
          echo "$HOME/macos-user/.local/bin" >> "$GITHUB_PATH"
          PATH="$HOME/macos-user/.local/bin:$PATH"
          export PATH
          rm -rf /tmp/idris2-pack
      - name: Use latest pack commit
        run: |
          pack info
          pack update
          pack info
      - name: Install pack-admin
        run: pack --no-prompt install-app pack-admin
      - name: Create macOS collection
        env:
          TARGET_OS: macos
        run: |
          python3 <<'PY'
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          source = Path("collections/HEAD.toml")
          target = Path("/tmp/HEAD.toml")
          target_os = os.environ["TARGET_OS"]

          raw = source.read_text()

          with source.open("rb") as f:
              collection = tomllib.load(f)

          db = collection.get("db", {})

          selected = set()

          for name, entry in db.items():
              runs_on = entry.get("runs-on")

              if runs_on is None:
                  print(
                      f"error: [db.{name}] does not define 'runs-on'",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              if not isinstance(runs_on, list):
                  print(
                      f"error: [db.{name}].runs-on must be an array",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              invalid = set(runs_on) - {"ubuntu", "macos"}

              if invalid:
                  print(
                      f"error: [db.{name}] has invalid runs-on value(s): "
                      f"{sorted(invalid)}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

              if target_os in runs_on:
                  selected.add(name)

          sections = re.split(r"(?=^\[)", raw, flags=re.MULTILINE)

          output = []

          for section in sections:
              match = re.match(
                  r"^\[db\.([^\]]+)\]",
                  section,
              )

              if match is None:
                  output.append(section)
                  continue

              package = match.group(1)

              if package in selected:
                  output.append(section)

          target.write_text("".join(output))

          print(
              f"Selected {len(selected)} packages "
              f"for {target_os}:"
          )

          for name in sorted(selected):
              print(f"  {name}")
          PY
      - name: Copy HEAD
        run: cp /tmp/HEAD.toml "$PACK_STATE_DIR/db/HEAD.toml"
      - name: Extract Collection from HEAD
        run: pack-admin --no-prompt extract-from-head "$PACK_STATE_DIR/db/testdb.toml"
      - name: Switch to testdb
        run: pack --no-prompt switch "testdb"
      - name: Re-Install pack-admin
        run: pack --no-prompt install-app pack-admin
      - name: Check Collection
        run: pack-admin --no-prompt --skip-tests check-collection "$HOME/macos-user/output/"
      - name: Fail if missing
        run: test -f "$HOME/macos-user/output/testdb.toml"
